[project]
name = "transcript-this"
version = "0.1.0"
description = "Transcribe audio recordings to text using faster-whisper"
authors = [
    {name = "Marcel",email = "marcel.marusiak@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper (>=1.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
